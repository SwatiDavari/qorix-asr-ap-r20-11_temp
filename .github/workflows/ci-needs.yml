name: CI - Needs (Sphinx-needs)
on:
  push:
    paths: ["needs/**", "organisation/governance/**"]
  pull_request:
    paths: ["needs/**", "organisation/governance/**"]
  # Lets a manual run pin the qorix-gnc and/or qorix-vnv checkouts to a
  # specific tag each (see tag-release.yml) instead of always floating
  # main. Falls back to main when not manually triggered, or when left
  # blank.
  workflow_dispatch:
    inputs:
      qorix_gnc_ref:
        description: "qorix-gnc ref to build against (tag, branch, or commit) - defaults to main"
        required: false
        default: "main"
      qorix_vnv_ref:
        description: "qorix-vnv ref to build against (tag, branch, or commit) - defaults to main"
        required: false
        default: "main"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: needs
    steps:
      - uses: actions/checkout@v4
      # organisation/ is gitignored here on purpose - Qorix_gnc is its
      # single source of truth (see scripts/sync_org_content.sh). Checked
      # out as a public repo; if this ever starts failing with a 403 auth
      # error instead of a clean 404/not-found, add "token: ''" below to
      # force an anonymous clone instead of the default (repo-scoped)
      # GITHUB_TOKEN. working-directory: . overrides this job's needs/
      # default since Qorix_gnc lands at the repo root, not inside needs/.
      - name: Checkout Qorix_gnc (organisation/ content)
        uses: actions/checkout@v4
        with:
          repository: SwatiDavari/qorix-gnc
          ref: ${{ github.event.inputs.qorix_gnc_ref || 'main' }}
          path: Qorix_gnc
      # testing/ (ISO 29119) split out of Qorix_gnc into its own repo -
      # same reasoning as the Qorix_gnc checkout above.
      - name: Checkout Qorix_vnv (organisation/testing/ content)
        uses: actions/checkout@v4
        with:
          repository: SwatiDavari/qorix-vnv
          ref: ${{ github.event.inputs.qorix_vnv_ref || 'main' }}
          path: Qorix_vnv
      - name: Sync organisation/ from Qorix_gnc + Qorix_vnv
        working-directory: .
        run: bash scripts/sync_org_content.sh Qorix_gnc Qorix_vnv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Export organisation/governance/'s org_req needs so this project's
      # :links: fields can cite them as real, checked link targets via
      # needs_external_needs (see needs/conf.py) instead of unenforced
      # free-text prose. Runs from the repo root - the root project (not
      # this one) owns org_req.
      - name: Install root-project deps (for org_req export)
        working-directory: .
        run: pip install sphinx sphinx-needs sphinxcontrib-plantuml Pillow myst-parser

      - name: Export organisation/governance/ needs.json
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless graphviz plantuml
          sphinx-build -b needs . _build/org_needs
          mkdir -p needs/_external_needs
          cp _build/org_needs/needs.json needs/_external_needs/org_needs.json

      # Fails on: duplicate need ids, links pointing at a non-existent id
      # (broken sys->feat->comp->unit traceability, or now a broken link to
      # an org_req id), any Sphinx warning.
      - name: Build with warnings as errors
        run: sphinx-build -b html -W . _build/html

      - uses: actions/upload-artifact@v4
        with:
          name: needs-html
          path: needs/_build/html
